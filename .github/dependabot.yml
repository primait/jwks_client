version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: weekly
      time: "21:00"
      day: sunday
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      time: "21:00"
      day: sunday
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directories:
      - "*"
    schedule:
      interval: weekly
      time: "21:00"
      day: sunday
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
